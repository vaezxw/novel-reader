workflows:
  ios-unsigned-ipa:
    name: iOS Unsigned IPA (Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_NAME: InkShelf
    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install --repo-update
      - name: Build iOS unsigned
        script: |
          set -euo pipefail
          # Ensure Generated.xcconfig also disables signing (Flutter may regenerate it).
          {
            echo 'CODE_SIGNING_ALLOWED=NO'
            echo 'CODE_SIGNING_REQUIRED=NO'
            echo 'CODE_SIGN_IDENTITY='
            echo 'DEVELOPMENT_TEAM=INKSLF0001'
            echo 'PROVISIONING_PROFILE_SPECIFIER='
          } >> ios/Flutter/Generated.xcconfig

          flutter build ios --release --no-codesign
      - name: Package unsigned IPA for Sideloadly
        script: |
          set -euo pipefail
          APP_PATH="$(find build/ios/iphoneos -name 'Runner.app' -type d | head -n 1)"
          if [ -z "${APP_PATH}" ]; then
            APP_PATH="$(find build/ios -name 'Runner.app' -type d | head -n 1)"
          fi
          if [ -z "${APP_PATH}" ]; then
            echo "Runner.app not found"
            find build/ios -maxdepth 6 -type d -print || true
            exit 1
          fi
          echo "Packaging: ${APP_PATH}"
          IPA_DIR="build/ios/ipa"
          rm -rf "${IPA_DIR}"
          mkdir -p "${IPA_DIR}/Payload"
          cp -R "${APP_PATH}" "${IPA_DIR}/Payload/"
          (
            cd "${IPA_DIR}"
            zip -qr "${APP_NAME}-unsigned.ipa" Payload
            rm -rf Payload
          )
          ls -lah "${IPA_DIR}"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-release-apk:
    name: Android Release APK
    max_build_duration: 45
    # Free plan usually has mac_mini_m2; linux_x2 needs a paid plan.
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        APP_NAME: InkShelf
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
